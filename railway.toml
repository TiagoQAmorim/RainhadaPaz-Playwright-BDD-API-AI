# https://docs.railway.com/reference/config-as-code
# O volume /data só existe em runtime — no build usamos SQLite temporário para o Next pré-renderizar.
[build]
buildCommand = "npm run build"

[deploy]
# Schema/seed no boot (scripts/ensure-db.mjs) — pre-deploy não usa o volume /data em alguns projetos.
startCommand = "node scripts/ensure-db.mjs"
